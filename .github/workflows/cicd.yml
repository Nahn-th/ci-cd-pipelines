name: E-Learning CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

jobs:
  # ================= STAGE 1: CONTINUOUS INTEGRATION (CI) =================
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ma nguon
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # lay lich su git cho SonarCloud

        # Toi uu hoa: cau hinh cache cho Node Modules
      - name: Khoi tao Cache cho Node Modules (Backend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Chay kiem thu tu dong
      - name: Cai dat thu vien va chay Unit Test Backend
        run: |
          cd backend
          npm ci
          npm test

      - name: Cai dat thu vien va chay Unit Test frontend
        run: |
          cd frontend
          npm install
          CI=true npm test

      # Thêm bước này để giữ lại bộ nhớ quét của lần trước
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Quet chat luong va bao mat code (SonarCloud)
      - name: Phan tich tinh voi SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        if: "!contains(github.event.head_commit.message, '[skip sonar]')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ================= STAGE 2: CONTINUOUS DEPLOYMENT (CD) =================
  continuous-deployment:
    runs-on: ubuntu-latest
    needs: continuous-integration
    if: github.ref == 'refs/heads/main' # tu dong deploy khi code duoc merge vao main
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Setup Docker Buildx de build image nang cao
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Dang nhap vao Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build và Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/web-backend:latest

      - name: Build và Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/web-frontend:latest
          build-args: |
            REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL_PRODUCTION }}

      # Deploy len server ao bang SSH
      # Ket noi vao vps, pull file docker-compose moi nhat, pull image moi ve va khoi dong lai docker container
      - name: Deploy ung dung len Server bang SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/app
            git pull origin main
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
