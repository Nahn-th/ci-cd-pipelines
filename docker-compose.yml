services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: web_backend
    restart: always
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    networks:
      - web_network

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5001}
    container_name: web_frontend
    restart: no
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - web_network

networks:
  web_network:
    driver: bridge
