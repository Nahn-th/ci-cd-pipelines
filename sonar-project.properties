
# SonarQube Configuration File 

# name of the project, must be unique in SonarQube
sonar.projectKey=devops-ci-cd-pipelines

sonar.projectName=DevOps CI-CD Pipelines E-Learning
sonar.projectVersion=1.0.0
sonar.sources=backend,frontend/src
sonar.sourceEncoding=UTF-8

# Các thư mục và file loại trừ khỏi quá trình phân tích (tránh quét code thư viện hoặc build)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.js,**/*.spec.js,frontend/src/setupTests.js

# Exclude node_modules, build, dist, coverage folders and test files from analysis
sonar.tests=tests

# Chỉ định định dạng file test để SonarQube phân biệt giữa code chạy và code test
sonar.test.inclusions=tests/**/*.test.js

# configure the path to the lcov report generated by Jest
sonar.javascript.lcov.reportPaths=coverage/lcov.info
