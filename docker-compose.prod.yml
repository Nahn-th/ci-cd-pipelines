services:
  api:
    image: ${DOCKERHUB_USERNAME}/web-backend:latest
    container_name: prod_backend
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    networks:
      - web_network

  web:
    image: ${DOCKERHUB_USERNAME}/web-frontend:latest
    container_name: prod_frontend
    restart: always
    volumes:
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - web_network

  caddy:
    image: caddy:latest
    container_name: prod_caddy
    restart: unless-stopped
    ports:
      - "80:80"     # Hứng port 80 để tự động chuyển hướng sang 443
      - "443:443"   # Cổng HTTPS chính thức cho đồ án
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data      # Giữ lại cert SSL khi container restart
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - web_network

    # Thu thap du lieu tu droplet bang node exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: prod_node_exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    networks:
      - web_network

  # thu thap du lieu bang prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prod_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - web_network

  loki:
    image: grafana/loki:latest
    container_name: prod_loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    mem_limit: 300m
    volumes:
      - loki_data:/loki
    networks:
      - web_network

  promtail:
    image: grafana/promtail:latest
    container_name: prod_promtail
    mem_limit: 200m
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - web_network

  # Giao dien bieu do Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: prod_grafana
    ports:
      - "3000:3000" # Mo cong 3000 de truy cap Grafana xem bieu do
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - web_network

networks:
  web_network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  loki_data:
